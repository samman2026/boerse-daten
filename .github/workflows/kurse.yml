name: Kurse holen
on:
  schedule:
    # Montag bis Freitag, alle 15 Minuten von 06:45 bis 20:45 UTC (08:45 bis 22:45 Zuerich Sommerzeit)
    - cron: "*/15 6-20 * * 1-5"
    # Wochenende stuendlich (Krypto)
    - cron: "5 * * * 0,6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kurse
  cancel-in-progress: true
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance pandas
      - run: python holen.py
      - name: Speichern
        run: |
          git config user.name "kurs-bot"
          git config user.email "kurs-bot@users.noreply.github.com"
          git add kurse.json kurse.md
          git commit -m "Kurse $(date -u +%Y-%m-%dT%H:%MZ)" || echo "keine Aenderung"
          git push
